name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  schemas:
    name: IR schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: schemas/tools/requirements.txt
      - run: pip install -r schemas/tools/requirements.txt
      - run: python schemas/tools/validate.py

  backend:
    name: backend build & test
    runs-on: ubuntu-latest
    needs: schemas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build & test (unit only; DB-gated context test skipped without ROBOVERIFY_DB=1)
        working-directory: backend
        run: mvn -B verify

  runtime:
    name: runtime lint & test
    runs-on: ubuntu-latest
    needs: schemas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: runtime/pyproject.toml
      - name: Install
        working-directory: runtime
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: runtime
        run: ruff check src tests
      - name: Test
        working-directory: runtime
        run: pytest

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          npm run typecheck

  docker:
    name: docker images buildable
    runs-on: ubuntu-latest
    needs: [backend, runtime, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (compose)
        working-directory: deploy
        run: docker compose build backend runtime frontend
