# RoboVerify 全栈部署（Docker 容器化，不在开发机本地跑进程）。
# PostgreSQL：M0 起必需；backend/runtime/frontend：应用全栈；SeaweedFS：对象存储（ADR-0005，可选启动）。
#
# Usage:
#   docker compose up -d postgres                            # 仅数据库（本地调代码用）
#   docker compose up -d postgres backend runtime worker frontend   # 应用全栈（正式形态）
#   docker compose up -d                                     # 全量（再加 SeaweedFS）
#
#   Frontend  -> http://localhost:18000
#   Backend   -> http://localhost:18090/actuator/health
#   Runtime   -> http://localhost:18081/health
#   PostgreSQL-> localhost:15432  (roboverify / roboverify, db: roboverify)
#   SeaweedFS S3 -> localhost:18333 (roboverify / roboverify-secret)，状态页 localhost:19333
#
# 非默认宿主端口，避免与本机已有服务冲突；可用 .env 覆盖（见 deploy/.env.example）。

name: roboverify

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: roboverify-backend
    environment:
      ROBOVERIFY_DB_URL: jdbc:postgresql://postgres:5432/roboverify
      ROBOVERIFY_DB_USER: roboverify
      ROBOVERIFY_DB_PASSWORD: roboverify
      ROBOVERIFY_RUNTIME_URL: http://runtime:8081
      # 存储切换（默认 local 不变；启用 SeaweedFS 见 deploy/demo/verify-seaweedfs.sh）
      ROBOVERIFY_STORAGE_TYPE: ${ROBOVERIFY_STORAGE_TYPE:-local}
      ROBOVERIFY_S3_ENDPOINT: ${ROBOVERIFY_S3_ENDPOINT:-}
      ROBOVERIFY_S3_ACCESS_KEY: ${ROBOVERIFY_S3_ACCESS_KEY:-}
      ROBOVERIFY_S3_SECRET_KEY: ${ROBOVERIFY_S3_SECRET_KEY:-}
      ROBOVERIFY_S3_BUCKET: ${ROBOVERIFY_S3_BUCKET:-roboverify}
    ports:
      - "${BACKEND_PORT:-18090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # temurin JRE 镜像无 wget/curl 且 dash 不支持 /dev/tcp，显式用 bash 探活
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8090 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  runtime:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    container_name: roboverify-runtime
    environment:
      ROBOVERIFY_DATABASE_URL: postgresql://roboverify:roboverify@postgres:5432/roboverify
    ports:
      - "${RUNTIME_PORT:-18081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  # 实验引擎 worker：同一镜像，跑任务消费循环（SKIP LOCKED）
  worker:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    container_name: roboverify-worker
    command: ["python", "-m", "roboverify_runtime.worker.runner"]
    environment:
      ROBOVERIFY_DATABASE_URL: postgresql://roboverify:roboverify@postgres:5432/roboverify
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 仿真 worker（gz 集成已验证 2026-09-15）：docker compose --profile sim up -d sim-worker
  # 能力路由：requires='gz' 的任务只被本 worker 认领（普通 worker 无 gz 会显式失败）
  sim-worker:
    build:
      context: ..
      dockerfile: deploy/sim/gz.Dockerfile
    container_name: roboverify-sim-worker
    profiles: ["sim"]
    environment:
      ROBOVERIFY_DATABASE_URL: postgresql://roboverify:roboverify@postgres:5432/roboverify
      ROBOVERIFY_WORKER_CAPABILITIES: gz
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: roboverify-frontend
    ports:
      - "${FRONTEND_PORT:-18000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: roboverify-postgres
    environment:
      POSTGRES_USER: roboverify
      POSTGRES_PASSWORD: roboverify
      POSTGRES_DB: roboverify
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roboverify -d roboverify"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ---- SeaweedFS 对象存储（ADR-0005：S3 协议替代 MinIO）----
  # 单进程 server = master + volume + filer + S3 网关（demo/单机形态；扩容时拆多容器）。
  # backend 容器内访问 http://seaweedfs:8333；凭据见 ./seaweedfs/s3.json。
  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    container_name: roboverify-seaweedfs
    command: >
      server -dir=/data -ip=seaweedfs
      -master.volumeSizeLimitMB=2048
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${SEAWEED_S3_PORT:-18333}:8333"
      - "${SEAWEED_MASTER_PORT:-19333}:9333"
    volumes:
      - ./data/seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    restart: unless-stopped
