[project]
name = "roboverify-runtime"
version = "0.1.0"
description = "RoboVerify engineering runtime — verification kernel, workers, simulation adapters"
requires-python = ">=3.10"  # 主镜像 3.13；sim-worker（gz harmonic-full 基 Ubuntu 22.04）为 3.10，仅跑 worker/sim 路径
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "PyYAML>=6.0",
    "httpx>=0.28",
    "numpy>=2.1",
    "SALib>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboverify_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"  # 最低支持 3.10（sim-worker 的 gz 镜像），主镜像 3.13 亦兼容

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
