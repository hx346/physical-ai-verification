# Demo 替换配置：换 RGB-D 相机 C —— 预期定位精度 PASS（P95 ≈ 2.4mm）
schemaVersion: "0.1.0"
id: sys-rgbd-binpicking
name: "Bin Picking — RGB-D 配置（预期 PASS：相机 0.65m 近距，深度 σ 外推后 P95≈2.85mm）"
projectId: proj-bin-picking-demo
components:
  - id: robot-1
    type: robot
    assetId: asset-robot-a
  - id: cam-overhead-1
    type: depth_camera
    assetId: asset-rgbd-cam-c
    mountPose:
      x: 0.0
      y: 0.0
      z: 0.65
      roll: 0
      pitch: 90
      yaw: 0
      frame: world
  - id: gripper-1
    type: gripper
    assetId: asset-gripper-b
calibrations:
  - type: hand_eye
    method: tsai_lenz
    residual:
      reprojection_px: 0.4
      translation_mm: 0.8
network:
  topology: camera->switch->pc->robot-controller
  latency_ms: 12
  jitter_ms: 3
