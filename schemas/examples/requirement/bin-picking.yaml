# Bin picking demo — requirement set (V0.1 Demo, plan §42)
- schemaVersion: "0.1.0"
  id: R001
  metric: picking_success_rate
  operator: ">="
  value: 0.98
  unit: ratio
  percentile: mean
  confidence: 0.95
  priority: critical
  source: manual
  description: 零件抓取成功率 ≥ 98%（连续 8 小时运行）

- schemaVersion: "0.1.0"
  id: R002
  metric: cycle_time
  operator: "<="
  value: 6
  unit: s
  percentile: P95
  priority: critical
  source: manual
  description: 单循环节拍 P95 ≤ 6s

- schemaVersion: "0.1.0"
  id: R003
  metric: position_accuracy
  operator: "<="
  value: 3
  unit: mm
  percentile: P95
  priority: critical
  source: manual
  description: 目标定位精度 P95 ≤ 3mm（手眼标定后末端到达精度）

- schemaVersion: "0.1.0"
  id: R004
  metric: end_to_end_latency
  operator: "<="
  value: 100
  unit: ms
  percentile: P95
  priority: high
  source: manual
  description: 感知到控制端到端时延 P95 ≤ 100ms

- schemaVersion: "0.1.0"
  id: R005
  metric: reach
  operator: ">="
  value: 1.0
